name: Docker integration smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and exercise isolated containers
        env:
          SMOKE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docker_smoke.py --output "$RUNNER_TEMP/docker-smoke"
      - name: Clean only this smoke project
        if: always()
        run: python3 scripts/docker_smoke.py --output "$RUNNER_TEMP/docker-smoke" --cleanup-only
      - name: Publish concise result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/docker-smoke/evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/docker-smoke/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep small diagnostic evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-smoke/evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
