name: Remote file foundation and action integration POSIX

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  remote-file-posix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact environment
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/file-action-integration"
          mkdir -p "$evidence"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          {
            printf 'expected_head=%s\n' "$EXPECTED_HEAD"
            printf 'actual_head=%s\n' "$actual_head"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            python3 -VV
            uname -a
            stat -f -c 'filesystem=%T' "$RUNNER_TEMP"
          } | tee "$evidence/environment.txt"

      - name: Install selected validation and transport dependencies
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/file-action-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check \
            "pytest>=8.2,<9" "httpx>=0.27,<1" \
            "fastapi>=0.111,<1" "pydantic>=2.7,<3" \
            "python-multipart>=0.0.9,<1" "jinja2>=3.1,<4" \
            "PyYAML>=6,<7" "pymatgen>=2024.1,<2027" \
            "paramiko>=3.4,<5"
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"

      - name: Verify selected input, result, and SSH imports
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/file-action-integration"
          test "$(python3 -c 'import sys; print(sys.prefix)')" = "$RUNNER_TEMP/file-action-venv"
          {
            printf 'test_python=%s\n' "$(command -v python3)"
            python3 -VV
            python3 -c 'import sys; print("test_python_prefix=" + sys.prefix)'
          } | tee -a "$evidence/environment.txt"
          export HOME="$RUNNER_TEMP/file-action-home"
          export VASP_AI_HOME="$HOME/vasp-ai"
          export DATA_DIR="$HOME/app-data"
          export ENABLE_AI_MODE=false ENABLE_LLM=false
          mkdir -p "$HOME" "$VASP_AI_HOME" "$DATA_DIR"
          unset OPENAI_API_KEY MP_API_KEY
          python3 - <<'PY' | tee -a "$evidence/environment.txt"
          import httpx
          import pytest
          import fastapi
          import pydantic
          import jinja2
          import yaml
          import pymatgen
          import paramiko
          import multipart
          import sys
          import importlib.metadata
          sys.path.insert(0, "backend")
          import backend.input_validation
          import backend.toolbox.results
          import app.main
          import backend.toolbox.client
          import backend.toolbox.api
          import backend.toolbox.service
          import backend.toolbox.ssh.file_helper
          import backend.toolbox.ssh.remote_files
          import backend.toolbox.reviewer
          import backend.toolbox.review_transport
          import backend.ai_mode.reviewer
          import backend.ai_mode.server
          print(
              f"pytest={pytest.__version__} httpx={httpx.__version__} "
              f"fastapi={fastapi.__version__} pydantic={pydantic.__version__} "
              f"paramiko={paramiko.__version__} jinja2={jinja2.__version__} "
              f"pyyaml={yaml.__version__} "
              f"pymatgen={importlib.metadata.version('pymatgen')} "
              f"python-multipart={importlib.metadata.version('python-multipart')}"
          )
          PY

      - name: Exercise helper protocol and real POSIX filesystem
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/file-action-integration"
          test "$(python3 -c 'import sys; print(sys.prefix)')" = "$RUNNER_TEMP/file-action-venv"
          export HOME="$RUNNER_TEMP/file-action-home"
          export VASP_AI_HOME="$HOME/vasp-ai"
          export DATA_DIR="$HOME/app-data"
          export ENABLE_AI_MODE=false ENABLE_LLM=false
          mkdir -p "$HOME" "$VASP_AI_HOME" "$DATA_DIR"
          unset OPENAI_API_KEY MP_API_KEY
          python3 -m pytest -q \
            backend/tests/remote_file_foundation \
            backend/tests/remote_file_review \
            backend/tests/file_action_integration \
            backend/tests/file_action_review \
            backend/tests/reviewer \
            backend/tests/reviewer_review \
            backend/tests/basic_release_validation \
            backend/tests/test_input_validation_unit.py \
            backend/tests/test_nl_plan_api.py \
            backend/tests/test_toolbox_results.py \
            backend/tests/be_a/test_kpoints.py \
            backend/tests/be_a/test_pipeline_contract.py \
            backend/tests/be_a/test_golden.py \
            backend/tests/be_a/test_bundle_zip.py \
            backend/tests/be_a/test_reports.py \
            --basetemp="$RUNNER_TEMP/file-action-integration-work" \
            --junitxml="$evidence/pytest.xml" \
            2>&1 | tee "$evidence/pytest.log"
          python3 backend/tests/remote_file_review/ci_assert.py "$evidence/pytest.xml" \
            | tee "$evidence/critical-foundation-tests.txt"
          python3 backend/tests/file_action_review/ci_assert.py "$evidence/pytest.xml" \
            | tee "$evidence/critical-action-tests.txt"
          python3 backend/tests/reviewer_review/ci_assert.py "$evidence/pytest.xml" \
            | tee "$evidence/critical-reviewer-tests.txt"
          python3 backend/tests/basic_release_validation/ci_assert.py "$evidence/pytest.xml" \
            | tee "$evidence/critical-basic-release-tests.txt"
          python3 backend/tests/gamma_default_review/ci_assert.py "$evidence/pytest.xml" \
            | tee "$evidence/critical-gamma-default-tests.txt"

      - name: Keep small diagnostic evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-action-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/file-action-integration/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
