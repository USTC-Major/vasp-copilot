# VASP-Doctor 前端 nginx 配置：SPA + API 反代（与 vite dev 代理路由一致）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS；变量形式延迟解析可选 AI 服务，使 ai_mode 容器缺席时
    # nginx 仍能启动并完整提供 Toolbox。访问 /ai/v1 时才返回上游不可用。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 工具箱主后端（8000）
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 256m;
    }

    # 智能模式后端（8500）
    location /ai/v1/ {
        set $ai_upstream http://ai_mode:8500;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
