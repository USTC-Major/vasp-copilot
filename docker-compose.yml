# VASP-Doctor Compose：Toolbox 独立运行，AI 服务按需启用
#   docker compose up --build -d             # Toolbox + 前端
#   docker compose --profile ai up --build -d # 另外启用 AI 客户端
#   浏览器访问 http://127.0.0.1:5173（nginx 内已反代 /api/v1 -> 8000、/ai/v1 -> 8500）
# .env 为可选（不存在也能启动，仅使用默认值；LLM API key 等自定义项写在这里）。
# 安全默认：仅前端 5173 发布到宿主机且只绑 127.0.0.1；8000/8500 无用户级鉴权，
# 仅在 Docker 内部网络供 nginx 反代访问，不对宿主机/局域网暴露。
services:
  backend:
    build:
      context: ./backend
    image: vasp-doctor:local
    env_file:
      - path: .env
        required: false   # 可选：有则覆盖（LLM/阈值），缺失不影响一键 docker compose up
    environment:
      DATA_DIR: /data/tmp
      TTL_SECONDS: 86400
      VASP_AI_HOME: /data/app/ai_mode  # 兼容旧数据根；8000 独占执行库与监控
    # 安全：8000 无鉴权，默认不发布到宿主机；前端经 Docker 内部网络反代访问。
    # 如需本机调试可直接访问，可自行加回：
    # ports:
    #   - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/data/app
      - temp_data:/data/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,time;time.sleep(0);urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      start_period: 8s
      retries: 5
    restart: unless-stopped

  # 可选智能模式：仅聊天/模型，通过 HTTP 调用 backend 的执行工具
  ai_mode:
    profiles: ["ai"]
    build:
      context: ./backend
    image: vasp-doctor:local
    command: ["uvicorn", "ai_mode.server:app", "--app-dir", "/repo/backend",
              "--host", "0.0.0.0", "--port", "8500", "--log-level", "info"]
    environment:
      ENABLE_AI_MODE: "true"
      TOOLBOX_URL: http://backend:8000
      VASP_AI_HOME: /data/app/ai_mode   # 聊天与执行分文件存储；旧 ai_store.json 只读导入
      DATA_DIR: /data/tmp
      TTL_SECONDS: 86400
    env_file:
      - path: .env
        required: false
    # 安全：8500（AI 对话与 Toolbox 客户端，无用户级鉴权）默认不发布到宿主机。
    # 如需本机调试可直接访问，可自行加回：
    # ports:
    #   - "127.0.0.1:8500:8500"
    volumes:
      - app_data:/data/app
      - temp_data:/data/tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8500/docs', timeout=3)"]
      interval: 10s
      timeout: 3s
      start_period: 8s
      retries: 5
    restart: unless-stopped

  # 前端：Node 构建 -> nginx 托管（SPA + API 反代），后端健康后才启动
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  app_data:   # /data/app —— 执行库、聊天库与设置分文件持久化（保留旧数据根）
  temp_data:  # /data/tmp  —— TTL 临时数据：uploads / runs / reports
